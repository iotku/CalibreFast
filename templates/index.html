<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
</head>
<body>
<header class="top-bar">
    <div class="top-bar-left">
        <h1 class="title">{{ .Title }}</h1>
        <a href="/authors" class="meta-link">Authors</a>
        <a href="/publishers" class="meta-link">Publishers</a>
        <a href="/tags" class="meta-link">Tags</a>
    </div>
    <div class="top-bar-center">
        <form id="search-form" action="/search" method="get">
            <input name="q" type="search" placeholder="Search…"
                   style="height:44px; font-size:16px; padding:0 12px; width:300px;" />
        </form>
    </div>
    <div class="top-bar-right">
        <button id="prev-page" aria-label="Previous page">&lsaquo;</button>
        <label for="page-input">Page</label>
        <input id="page-input" type="number" min="1" value="1" style="width:56px; text-align:center;" />
        <span>of <span id="total-pages">—</span></span>
        <button id="next-page" aria-label="Next page">&rsaquo;</button>
    </div>
</header>
<div id="book-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="modal-close">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<div id="books" hx-get="/api/books?page=1" hx-trigger="load" hx-swap="innerHTML"></div>
<div id="load-more" style="height: 1px;" hx-get="/api/books?page=2" hx-trigger="revealed" hx-swap="beforeend" hx-include="#page-input"></div>
<script type="module" src="/static/shared.js"></script>
<script type="module" src="/static/app-htmx.js"></script>
</body>
</html>
