<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
</head>
<body>
<header class="top-bar">
    <div class="top-bar-left">
        <h1 class="title">{{ .Title }}</h1>
        <a href="/authors" class="meta-link">Authors</a>
        <a href="/publishers" class="meta-link">Publishers</a>
        <a href="/tags" class="meta-link">Tags</a>
    </div>
    <div class="top-bar-center">
        <form id="search-form" action="/search" method="get">
            <input name="q" type="search" placeholder="Search…"
                   style="height:44px; font-size:16px; padding:0 12px; width:300px;" />
        </form>
    </div>
    <div class="top-bar-right">
        <button hx-get="/htmx-page?page={{ if gt .CurrentPage 1 }}{{ sub .CurrentPage 1 }}{{ else }}1{{ end }}" 
                hx-target="#books" 
                hx-swap="innerHTML"
                hx-push-url="true"
                {{ if le .CurrentPage 1 }}disabled{{ end }}
                aria-label="Previous page">&lsaquo;</button>
        <label for="page-input">Page</label>
        <input id="page-input" 
               type="number" 
               min="1" 
               max="{{ .TotalPages }}"
               value="{{ .CurrentPage }}" 
               style="width:56px; text-align:center;"
               hx-get="/htmx-page"
               hx-trigger="change"
               hx-target="#books"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-include="this"
               name="page" />
        <span>of <span id="total-pages">{{ .TotalPages }}</span></span>
        <button hx-get="/htmx-page?page={{ if lt .CurrentPage .TotalPages }}{{ add .CurrentPage 1 }}{{ else }}{{ .TotalPages }}{{ end }}" 
                hx-target="#books" 
                hx-swap="innerHTML"
                hx-push-url="true"
                {{ if ge .CurrentPage .TotalPages }}disabled{{ end }}
                aria-label="Next page">&rsaquo;</button>
    </div>
</header>
<div id="book-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="modal-close">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<div id="books" 
     hx-get="/htmx-page?page={{ .CurrentPage }}" 
     hx-trigger="load" 
     hx-swap="innerHTML">
    Loading...
</div>
<script type="module" src="/static/shared.js"></script>
<script type="module" src="/static/app-htmx.js"></script>
</body>
</html>
