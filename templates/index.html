<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top-bar">
    <h1 class="title">{{ .Title }}</h1>

    <form id="search-form" action="/search" method="get"
          style="position:absolute; left:50%; transform:translateX(-50%);">
        <input name="q" type="search" placeholder="Search…"
               style="height:44px; font-size:16px; padding:0 12px; width:300px;" />
    </form>

    <div style="display:inline-flex; align-items:center; gap:8px;">
        <button id="prev-page" aria-label="Previous page">&lsaquo;</button>
        <label for="page-input">Page</label>
        <input id="page-input" type="number" min="1" value="1" style="width:56px; text-align:center;" />
        <span>of <span id="total-pages">—</span></span>
        <button id="next-page" aria-label="Next page">&rsaquo;</button>
    </div>
</header>
<div id="book-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="modal-close">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<div id="books"></div>
<div id="load-more" style="height: 1px;"></div>
<script type="module" src="/static/shared.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
