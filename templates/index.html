<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>{{ .Title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="{{ asset "style.css" }}" />
        <!-- No htmx history: the URL and back/forward belong to app-htmx.ts and modal.ts. -->
        <meta name="htmx-config" content="history:false" />
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/htmx.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/ext/hx-preload.js"></script>
    </head>
    <body>
{{ $tb := topbar }}
{{ template "topbar-start" $tb }}
{{ template "topbar-pager" }}
{{ template "topbar-end" $tb }}
        <div id="books" data-page-url="/pages/page{n}.json?v={{ .PagesVersion }}" data-page-size="{{ booksPerPage }}" data-total-books="{{ .TotalBooks }}"></div>
        <div id="book-modal" class="modal-overlay">
            <div class="modal-content">
                <button id="modal-close" aria-label="Close modal">✕</button>
                <div id="modal-body"></div>
            </div>
        </div>

        <div id="scroll-badge"></div>

        <script type="module" src="{{ asset "app-htmx.js" }}"></script>
    </body>
</html>
