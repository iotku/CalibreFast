<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Search — {{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="top-bar">
    <div style="display:inline-flex; align-items:center; gap:12px;">
        <button style="height:44px;" onclick="history.back()" aria-label="Back to library">&#8592; Back</button>
        <h1 class="title">Search</h1>
    </div>

    <form id="search-form" style="position:absolute; left:50%; transform:translateX(-50%); display:inline-flex; align-items:center; gap:8px;">
        <input id="search-input" type="search" placeholder="Title or author…"
               style="height:44px; font-size:16px; padding:0 12px; width:300px;" />
        <button type="button" id="search-btn" style="height:44px; padding:0 16px;">Search</button>
    </form>

    <div></div>
</header>
<div id="book-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="modal-close">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<p id="search-status" style="text-align:center;"></p> <!-- TODO don't get covered by top bar! -->
<div id="books"></div>
<div id="load-more" style="height:1px;"></div>
<script type="module" src="/static/shared.js"></script>
<script type="module" src="/static/search.js"></script>
</body>
</html>
