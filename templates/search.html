<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ if .Query }}{{ .Query }} — {{ end }}Search — {{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/ext/hx-preload.js"></script>
</head>
<body>
<header class="top-bar">
    <div class="top-bar-left">
        <button class="btn-back" onclick="history.back()" aria-label="Back">&#8592; Back</button>
        <form id="search-form" action="/search" method="get">
            <input name="q" type="search" value="{{ .Query }}" placeholder="Title or author…"
                   class="input-search" aria-label="Search books" autofocus />
        </form>
    </div>
    <div class="top-bar-right">
        <button id="prev-page" class="btn-nav" aria-label="Previous page">&lsaquo;</button>
        <input id="page-input" type="number" min="1" value="1" class="input-page" />
        <span>/ <span id="total-pages">—</span></span>
        <button id="next-page" class="btn-nav" aria-label="Next page">&rsaquo;</button>
    </div>
</header>
{{ if .Query }}
<div id="books" data-page-url="/api/search?q={{ .Query }}&page={n}" data-total-pages="{{ .TotalPages }}" data-empty-text="No results found."></div>
{{ else }}
<div id="books" data-total-pages="0" data-empty-text=""></div>
{{ end }}
<p id="status" class="status-message"></p>
<div id="book-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="modal-close" aria-label="Close modal">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<div id="scroll-badge"></div>
<script type="module" src="/static/app-htmx.js"></script>
</body>
</html>
