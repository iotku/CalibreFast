<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Search — {{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/ext/hx-preload.js"></script>
</head>
<body>
<header class="top-bar">
    <div class="top-bar-controls">
        <button class="btn-back" onclick="history.back()" aria-label="Back to library">&#8592; Back</button>
        <h1 class="title">Search</h1>
    </div>

    <form id="search-form" class="top-bar-center-abs top-bar-controls">
        <input id="search-input" type="search" placeholder="Title or author…" class="input-search" />
        <button type="button" id="search-btn" class="btn-standard">Search</button>
    </form>

    <div></div>
</header>
<div id="book-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="modal-close">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<div id="books"></div>
<div id="load-more" class="load-more-sentinel"></div>
<p id="search-status" class="status-message"></p>
<script type="module" src="/static/shared.js"></script>
<script type="module" src="/static/search.js"></script>
</body>
</html>
