<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reader — {{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ asset "style.css" }}">
    <!-- JSZip lets epub.js open the whole .epub from memory (web/reader.ts). -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js" integrity="sha384-DdGlNq+wVXAn83gXqwyeFHB7iyXy6L0rLrNzgDmhKWPjiJLg9vj6qosYmZmkMfQ+" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
</head>
<body class="reader-page">
<header class="top-bar">
    <button class="btn-back" type="button">&#8592; Back</button>

    <div class="top-bar-center-abs top-bar-controls">
        <button id="prev-btn" class="btn-icon">&#8249;</button>
        <span id="progress-label" class="reader-progress">—</span>
        <button id="next-btn" class="btn-icon">&#8250;</button>
    </div>

    <div class="top-bar-controls">
        <span id="sync-status" class="reader-sync" role="status"></span>
        <button id="bookmark-btn" class="btn-icon" title="Bookmark this page" aria-label="Bookmark this page">🔖</button>
        <button id="toc-btn" class="btn-standard" aria-controls="toc-sidebar" aria-expanded="false">Contents</button>
        <button id="font-down" class="btn-icon">A-</button>
        <button id="font-up" class="btn-icon">A+</button>
    </div>
</header>

<aside id="toc-sidebar" class="toc-sidebar" aria-label="Contents and bookmarks">
    <h2>Contents</h2>
    <ul id="toc-list" class="toc-list"></ul>
    <h2>Bookmarks</h2>
    <ul id="bookmark-list" class="toc-list bookmark-list"></ul>
</aside>

<div id="reader-container"></div>

<script type="module" src="{{ asset "reader.js" }}"></script>
</body>
</html>
