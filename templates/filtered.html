<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="top-bar">
    <button onclick="history.back()" style="height:44px;">&#8592; Back</button>
    <div style="position:absolute; left:50%; transform:translateX(-50%);">
        <h1 id="page-title" class="title"></h1>
    </div>
    <div></div>
</header>
<div id="books"></div>
<div id="load-more" style="height:1px;"></div>
<p id="status" style="text-align:center; padding:2rem 0;"></p>
<div id="book-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="modal-close">✕</button>
        <div id="modal-body"></div>
    </div>
</div>
<script type="module" src="/static/filtered.js"></script>
</body>
</html>
