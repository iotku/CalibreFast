<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reader — {{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="reader-page">
<header class="top-bar">
    <button onclick="history.back()" style="height:44px;">&#8592; Back</button>
    <div style="position:absolute; left:50%; transform:translateX(-50%); display:inline-flex; align-items:center; gap:8px;">
        <button id="prev-btn" style="height:44px; width:44px;">&#8249;</button>
        <span id="progress-label" style="font-size:14px; min-width:100px; text-align:center;">— / —</span>
        <button id="next-btn" style="height:44px; width:44px;">&#8250;</button>
    </div>
    <div style="display:inline-flex; align-items:center; gap:8px;">
        <button id="toc-btn" style="height:44px; padding:0 12px;">Contents</button>
        <label style="display:inline-flex; align-items:center; gap:6px; height:44px; cursor:pointer;">
            <input type="checkbox" id="dual-toggle" style="width:18px; height:18px;" />
            Dual
        </label>
        <button id="font-down" style="height:44px; width:44px;">A-</button>
        <label style="display:inline-flex; align-items:center; gap:6px; height:44px; cursor:pointer;">
            <input type="checkbox" id="fit-toggle" style="width:18px; height:18px;" />
            Fit
        </label>
        <button id="font-up" style="height:44px; width:44px;">A+</button>
    </div>
</header>
<div id="toc-sidebar" style="display:none; position:fixed; top:var(--topbar-total); left:0; bottom:0; width:280px; background:rgba(20,20,20,0.97); z-index:999; overflow-y:auto; padding:16px;">
    <h2 style="margin-bottom:1rem;">Contents</h2>
    <ul id="toc-list" style="list-style:none; padding:0; margin:0;"></ul>
</div>
<div id="pdf-container">
    <canvas id="pdf-canvas"></canvas>
</div>
<script src=" https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/wasm/openjpeg_nowasm_fallback.min.js "></script>
<link href=" https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/web/pdf_viewer.min.css " rel="stylesheet">
<script type="module" src="/static/reader-pdf.js"></script>
</body>
</html>
