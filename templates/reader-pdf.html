<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reader — {{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
</head>
<body class="reader-page">
<header class="top-bar">
    <button class="btn-back" onclick="history.back()">&#8592; Back</button>
    <div class="top-bar-center-abs top-bar-controls">
        <button id="prev-btn" class="btn-icon">&#8249;</button>
        <span id="progress-label" class="reader-progress-pdf">— / —</span>
        <button id="next-btn" class="btn-icon">&#8250;</button>
    </div>
    <div class="top-bar-controls">
        <button id="toc-btn" class="btn-standard">Contents</button>
        <label class="reader-label">
            <input type="checkbox" id="dual-toggle" class="reader-checkbox" />
            Dual
        </label>
        <button id="font-down" class="btn-icon">A-</button>
        <label class="reader-label">
            <input type="checkbox" id="fit-toggle" class="reader-checkbox" />
            Fit
        </label>
        <button id="font-up" class="btn-icon">A+</button>
    </div>
</header>
<div id="toc-sidebar" class="toc-sidebar-pdf">
    <h2>Contents</h2>
    <ul id="toc-list" class="toc-list"></ul>
</div>
<div id="pdf-container">
    <canvas id="pdf-canvas"></canvas>
</div>
<script src=" https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/wasm/openjpeg_nowasm_fallback.min.js "></script>
<link href=" https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/web/pdf_viewer.min.css " rel="stylesheet">
<script type="module" src="/static/reader-pdf.js"></script>
</body>
</html>
