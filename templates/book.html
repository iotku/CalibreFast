<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>

    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="book-page">

    <div class="book-page-cover">
        <img src="/cover/{{ .UUID }}" />
        <div id="read-buttons"></div>
    </div>

    <div class="book-page-info">
        <h1>{{ .Title }}</h1>
        <div class="download-section">
            {{ range .Formats }}
            <a class="download-btn" href="/download/{{ $.UUID }}/{{ . }}">
                Download {{ . }}
            </a>
            {{ end }}
        </div>
        <div class="meta-row">
            <strong>Author:</strong>
            {{ range .Authors }}
            <a href="/author/{{ . }}" class="meta-link">{{ . }}</a>
            {{ end }}
        </div>

        <div class="meta-row">
            <strong>Publisher:</strong>
            <a href="/publisher/{{ .Publisher }}" class="meta-link">{{ .Publisher }}</a>
        </div>

        <div class="meta-row">
            <strong>Date:</strong>
            {{ .Date }}
        </div>

        <div class="meta-row">
            <strong>Language:</strong>
            {{ .Language }}
        </div>

        {{if .Tags}}
        <div class="meta-row">
<!--            <strong>Tags:</strong>-->
            {{ range .Tags }}
            <a href="/tag/{{ . }}" class="tag meta-link">{{ . }}</a>
            {{ end }}
        </div>
        {{ else }}
        {{ end }}

        <div class="description">
            {{ .Description }}
        </div>
    </div>

</div>

</body>
</html>
