<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ asset "style.css" }}">
</head>
<body>
{{ $tb := topbar "Active" .Active "Title" .Title "NavTitle" true }}
{{ template "topbar-start" $tb }}
{{ template "topbar-end" $tb }}
<div id="aggregate-grid">
    {{- range .Items }}
    <a class="agg-item{{ if .Grouped }} agg-group{{ end }}" href="{{ .Href }}" style="font-size: {{ .FontSize }}px; --o: {{ .Opacity }}"
       {{- if .Grouped }} title="Group: {{ .Members }}"{{ end }}>{{ .Name }}{{ if .Sub }} <span class="agg-sub">{{ .Sub }}</span>{{ end }} ({{ .Count }})</a>
    {{- else }}
    <p class="status-message">Nothing found.</p>
    {{- end }}
</div>
</body>
</html>
