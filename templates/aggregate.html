<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top-bar">
    <button class="btn-back" onclick="history.back()">&#8592; Back</button>
    <div class="top-bar-center-abs">
        <h1 class="title">{{ .Title }}</h1>
    </div>
    <span id="user-nav" class="user-nav"></span>
</header>
<div id="aggregate-grid">
    {{- range .Items }}
    <a class="agg-item{{ if .Grouped }} agg-group{{ end }}" href="{{ .Href }}" style="font-size: {{ .FontSize }}px; --o: {{ .Opacity }}"
       {{- if .Grouped }} title="Group: {{ .Members }}"{{ end }}>{{ .Name }}{{ if .Sub }} <span class="agg-sub">{{ .Sub }}</span>{{ end }} ({{ .Count }})</a>
    {{- else }}
    <p class="status-message">Nothing found.</p>
    {{- end }}
</div>
<script type="module" src="/static/nav.js"></script>
</body>
</html>
