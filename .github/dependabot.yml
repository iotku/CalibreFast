# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The server's modules.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # Build tools (tsgo, esbuild) used by go generate. After merging an update,
  # run go generate and commit static/dist if the output changed
  # (TestTypeScriptUpToDate fails otherwise).
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"

  # Actions used by the workflows, pinned by commit SHA; Dependabot updates
  # the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
