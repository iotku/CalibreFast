# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.0'

    - name: Generate (type-check TypeScript, rebuild static/dist)
      run: go generate ./...

    - name: Check generated files are committed
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "go generate changed files; run it and commit the result:"
          git status --porcelain
          git diff --stat
          exit 1
        fi

    - name: Build
      run: go build -v -tags sqlite_fts5 ./...

    - name: Test
      run: go test -v -tags sqlite_fts5 ./...

    - name: Test without FTS5 (the build refuses removals clearly)
      run: go test -run 'Recycle' ./...
